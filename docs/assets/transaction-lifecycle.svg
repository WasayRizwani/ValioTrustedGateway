<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" fill="none">
  <defs>
    <filter id="softShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0052CC"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
  </defs>

  <rect width="1400" height="560" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="46" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#003882">Two-Phase Transaction Safety: Firm Quote → Snapshot Intent → Revalidated Commit</text>
  <text x="40" y="70" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="13.5" font-weight="500" fill="#475569">Every order flows through deterministic policy gates, cryptographic human sign-off when breached, and live Valio stock/price revalidation.</text>

  <!-- STEP 1: FIRM QUOTE -->
  <rect x="36" y="106" width="236" height="390" rx="18" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="54" y="126" width="84" height="24" rx="12" fill="#EFF6FF"/>
  <text x="96" y="142" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#1D4ED8" text-anchor="middle">STEP 1</text>
  <text x="54" y="176" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0F172A">Signed Firm Quote</text>
  <text x="54" y="196" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0052CC">POST /v1/quotes</text>

  <rect x="54" y="216" width="200" height="86" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="68" y="238" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">Single or Multi-Item Basket</text>
  <text x="68" y="257" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#475569">• Pack math &amp; unit conversion</text>
  <text x="68" y="274" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#475569">• Firm price until validUntil (30m)</text>
  <text x="68" y="291" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#B45309">• availabilityHeld: false</text>

  <rect x="54" y="318" width="200" height="84" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="68" y="340" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#3730A3">Ed25519 Envelope v2</text>
  <text x="68" y="358" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#312E81">Signs subject.quoteId, price,</text>
  <text x="68" y="375" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#312E81">allergens, origin &amp; certs</text>

  <rect x="54" y="420" width="200" height="54" rx="10" fill="#0F172A"/>
  <text x="154" y="443" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="middle">Single-Use Token</text>
  <text x="154" y="460" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#CBD5E1" text-anchor="middle">Audit: quote_issued</text>

  <!-- STEP 2: INTENT & 17-RULE POLICY GATE -->
  <rect x="304" y="106" width="244" height="390" rx="18" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="322" y="126" width="84" height="24" rx="12" fill="#EFF6FF"/>
  <text x="364" y="142" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#1D4ED8" text-anchor="middle">STEP 2</text>
  <text x="322" y="176" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0F172A">Snapshot Intent</text>
  <text x="322" y="196" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0052CC">POST /v1/orders/intent</text>

  <rect x="322" y="216" width="208" height="170" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="336" y="238" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#0F172A">17-Rule Policy Verdict</text>
  <text x="336" y="258" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#334155">• Order &amp; Daily/Weekly/Monthly €</text>
  <text x="336" y="276" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#334155">• Velocity &amp; splitting (&gt;80% × 3)</text>
  <text x="336" y="294" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#334155">• Lactose-free vs low-lactose</text>
  <text x="336" y="312" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#334155">• CONTAINS + MAY_CONTAIN</text>
  <text x="336" y="330" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#334155">• Cut-off closingTime &amp; subs</text>
  <text x="336" y="352" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#DC2626">• Hard allergen breach → BLOCKED</text>
  <text x="336" y="370" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#059669">• Open duplicate intents reused</text>

  <rect x="322" y="402" width="208" height="72" rx="10" fill="#0F172A"/>
  <text x="426" y="427" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#F8FAFC" text-anchor="middle">SHA-256 snapshotHash</text>
  <text x="426" y="446" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8" text-anchor="middle">Locks lines + prices + failingRules</text>
  <text x="426" y="462" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#6EE7B7" text-anchor="middle">Prevents basket swap attacks</text>

  <!-- STEP 3A (TOP): AUTONOMOUS PATH -->
  <rect x="588" y="106" width="276" height="148" rx="18" fill="#ECFDF5" stroke="#34D399" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="608" y="124" width="132" height="24" rx="12" fill="#059669"/>
  <text x="674" y="140" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">PATH A · WITHIN MANDATE</text>
  <text x="608" y="172" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#064E3B">auto_eligible</text>
  <text x="608" y="194" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#065F46">Zero failing rules under customer</text>
  <text x="608" y="212" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#065F46">mandate. Procurement agent may</text>
  <text x="608" y="230" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#047857">proceed straight to commit →</text>

  <!-- STEP 3B (BOTTOM): HUMAN OVERRIDE PATH -->
  <rect x="588" y="274" width="276" height="222" rx="18" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="608" y="292" width="160" height="24" rx="12" fill="#D97706"/>
  <text x="688" y="308" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">PATH B · EXCEEDS MANDATE</text>
  <text x="608" y="338" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#78350F">pending_approval → approved</text>
  <text x="608" y="358" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#92400E">1. SSE /v1/stream pushes alert to Desk</text>
  <text x="608" y="376" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#78350F">2. Buyer key + snapshotHash match</text>
  <text x="608" y="394" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#78350F">3. Explicit acknowledgedRules[] check</text>
  <text x="608" y="412" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#4338CA">4. WebAuthn Passkey / ECDSA P-256 sig</text>
  <text x="608" y="430" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F766E">5. Optional authorizedFallback SKU</text>
  <rect x="608" y="446" width="236" height="32" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="726" y="466" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#DC2626" text-anchor="middle">Agent keys get 403 Forbidden here</text>

  <!-- STEP 4: LIVE REVALIDATION & FALLBACK CASCADE -->
  <rect x="904" y="106" width="232" height="390" rx="18" fill="#FFFFFF" stroke="#0052CC" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="922" y="126" width="84" height="24" rx="12" fill="#EFF6FF"/>
  <text x="964" y="142" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#1D4ED8" text-anchor="middle">STEP 4</text>
  <text x="922" y="176" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0F172A">Live Revalidation</text>
  <text x="922" y="196" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0052CC">POST /v1/orders/:id/commit</text>

  <rect x="922" y="216" width="196" height="128" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="936" y="238" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#0F172A">Fresh Valio Checks</text>
  <text x="936" y="257" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#334155">• Mandate active &amp; unrevoked</text>
  <text x="936" y="275" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#334155">• Live /api/price &amp; /availability</text>
  <text x="936" y="293" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#059669">• Inside TTL → honour quote €</text>
  <text x="936" y="311" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#334155">• Outside TTL → ≤2% drift cap</text>
  <text x="936" y="329" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#B45309">• New breach → re-approval</text>

  <rect x="922" y="358" width="196" height="116" rx="12" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="936" y="380" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#064E3B">Cold-Chain Cascade</text>
  <text x="936" y="399" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#065F46">If primary SKU stocks out right</text>
  <text x="936" y="415" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#065F46">before commit, auto-switches to</text>
  <text x="936" y="431" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#047857">authorizedFallback within</text>
  <text x="936" y="447" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#047857">maxTotalPrice &amp; allergen rules.</text>

  <!-- STEP 5: COMMITTED + AUDIT -->
  <rect x="1172" y="106" width="192" height="390" rx="18" fill="#003882" filter="url(#softShadow)"/>
  <rect x="1190" y="126" width="84" height="24" rx="12" fill="#059669"/>
  <text x="1232" y="142" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">STEP 5</text>
  <text x="1190" y="176" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Committed</text>
  <text x="1190" y="196" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#93C5FD">Order ID: ORD-*</text>

  <rect x="1190" y="218" width="156" height="92" rx="12" fill="#FFFFFF" fill-opacity="0.1" stroke="#60A5FA" stroke-opacity="0.4"/>
  <text x="1202" y="240" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">Idempotency Guard</text>
  <text x="1202" y="259" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#DBEAFE">• Sync revalidating CAS</text>
  <text x="1202" y="276" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#DBEAFE">• SQLite idx_idempotency</text>
  <text x="1202" y="293" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#6EE7B7">• Zero double-orders</text>

  <rect x="1190" y="324" width="156" height="82" rx="12" fill="#FFFFFF" fill-opacity="0.1" stroke="#60A5FA" stroke-opacity="0.4"/>
  <text x="1202" y="346" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">Kitchen Auto-Sync</text>
  <text x="1202" y="365" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#DBEAFE">Marks stock-on-order</text>
  <text x="1202" y="382" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#DBEAFE">&amp; updates spend ledger</text>

  <rect x="1190" y="420" width="156" height="56" rx="10" fill="#059669"/>
  <text x="1268" y="444" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">SHA-256 Audit Link</text>
  <text x="1268" y="461" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#D1FAE5" text-anchor="middle">prevHash → hash</text>

  <!-- Arrows -->
  <line x1="272" y1="300" x2="300" y2="300" stroke="#0052CC" stroke-width="2.4" marker-end="url(#arrBlue)"/>
  <path d="M 548 240 L 568 240 L 568 180 L 584 180" stroke="#059669" stroke-width="2.4" fill="none" marker-end="url(#arrGreen)"/>
  <path d="M 548 350 L 568 350 L 568 384 L 584 384" stroke="#D97706" stroke-width="2.4" fill="none" marker-end="url(#arrAmber)"/>
  <path d="M 864 180 L 884 180 L 884 250 L 900 250" stroke="#059669" stroke-width="2.4" fill="none" marker-end="url(#arrGreen)"/>
  <path d="M 864 384 L 884 384 L 884 330 L 900 330" stroke="#0052CC" stroke-width="2.4" fill="none" marker-end="url(#arrBlue)"/>
  <line x1="1136" y1="300" x2="1168" y2="300" stroke="#0052CC" stroke-width="2.6" marker-end="url(#arrBlue)"/>
</svg>
