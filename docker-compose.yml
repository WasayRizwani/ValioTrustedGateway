services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-valio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valio}
      POSTGRES_DB: ${POSTGRES_DB:-valio_gateway}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-valio} -d $${POSTGRES_DB:-valio_gateway}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${GATEWAY_PORT:-8787}:8787"
    env_file:
      - path: .env.example
        required: false
      - path: .env
        required: false
    environment:
      GATEWAY_PORT: "8787"
      DATABASE_URL: ${DATABASE_URL:-postgresql://valio:valio@postgres:5432/valio_gateway}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./keys:/app/keys
    command: >
      sh -c 'if [ ! -f /app/data/products.json ] && [ -n "$$VALIO_API_KEY" ]; then
        npm run download-data -w @tta/gateway || true;
      fi && exec npm run start -w @tta/gateway'
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8787/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  desk:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${DESK_PORT:-5173}:5173"
    environment:
      GATEWAY_PROXY_TARGET: http://gateway:8787
    command: ["npm", "run", "preview", "-w", "@tta/desk"]
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  demo:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - demo
    env_file:
      - path: .env.example
        required: false
      - path: .env
        required: false
    environment:
      GATEWAY_PUBLIC_URL: http://gateway:8787
    command: ["npm", "run", "demo:a"]
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  postgres_data:
