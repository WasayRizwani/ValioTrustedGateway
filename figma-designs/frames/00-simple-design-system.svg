<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none" id="Frame-00-Simple-Design-System">
  <defs>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="114%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>
  <rect id="Background" width="1440" height="900" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1440" height="96" rx="0" fill="#003882"/>
  <text x="64" y="46" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start">00 · Valio Aimo® Simple Kitchen Design System</text>
  <text x="64" y="72" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#BFDBFE" text-anchor="start">Designed for Busy Chefs &amp; Buyers — Zero Jargon, Spacious Layout, Plain Kitchen Language, 48px Touch Targets</text>
  <rect id="Colors-Card" x="64" y="128" width="636" height="310" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#softShadow)"/>
  <text x="96" y="168" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">Calm, Familiar Colors</text>
  <text x="96" y="194" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#475569" text-anchor="start">Clean white cards on soft Nordic milk gray — high contrast &amp; easy on tired eyes.</text>
  <rect x="96" y="220" width="130" height="110" rx="16" fill="#0052CC"/>
  <text x="161" y="358" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Valio Blue</text>
  <text x="161" y="380" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">#0052CC</text>
  <text x="161" y="402" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Main Actions</text>
  <rect x="242" y="220" width="130" height="110" rx="16" fill="#059669"/>
  <text x="307" y="358" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Fresh Green</text>
  <text x="307" y="380" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">#059669</text>
  <text x="307" y="402" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">In Stock / Auto</text>
  <rect x="388" y="220" width="130" height="110" rx="16" fill="#D97706"/>
  <text x="453" y="358" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Warm Amber</text>
  <text x="453" y="380" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">#D97706</text>
  <text x="453" y="402" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Needs Your OK</text>
  <rect x="534" y="220" width="130" height="110" rx="16" fill="#DC2626"/>
  <text x="599" y="358" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Safety Red</text>
  <text x="599" y="380" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">#DC2626</text>
  <text x="599" y="402" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Allergen Stop</text>
  <rect id="Language-Card" x="740" y="128" width="636" height="310" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#softShadow)"/>
  <text x="772" y="168" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">Plain Kitchen Language (Never Tech Jargon)</text>
  <text x="772" y="194" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#475569" text-anchor="start">Plus Jakarta Sans at generous 15px–28px sizes. Every message sounds human.</text>
  <rect x="772" y="218" width="572" height="84" rx="14" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="792" y="246" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#991B1B" text-anchor="start">DON&#x27;T SAY (Too Technical):</text>
  <text x="792" y="272" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#7F1D1D" text-anchor="start">&quot;Guardrail #G-04 triggered on GTIN 6408430010257; TTL 900s.&quot;</text>
  <rect x="772" y="318" width="572" height="92" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="792" y="346" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#065F46" text-anchor="start">DO SAY (Kitchen Friendly):</text>
  <text x="792" y="372" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#064E3B" text-anchor="start">&quot;Needs your quick OK — €1,184 is over your €800 auto-order limit.</text>
  <text x="792" y="394" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#064E3B" text-anchor="start">Price &amp; stock are held for you for 15 minutes.&quot;</text>
  <rect id="Components-Card" x="64" y="468" width="1312" height="384" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#softShadow)"/>
  <text x="96" y="510" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">Big, Clear Buttons &amp; Status Pills (48px–52px Height)</text>
  <g id="Pill-Ordered Automatically">
    <rect x="96" y="536" width="196" height="32" rx="16" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="194.0" y="556.5" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">Ordered Automatically</text>
  </g>
  <g id="Pill-Needs Your Quick OK">
    <rect x="308" y="536" width="190" height="32" rx="16" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <text x="403.0" y="556.5" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">Needs Your Quick OK</text>
  </g>
  <g id="Pill-Lactose-Free Verified">
    <rect x="514" y="536" width="196" height="32" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="612.0" y="556.5" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Lactose-Free Verified</text>
  </g>
  <g id="Pill-Blocked: Allergen Rule">
    <rect x="726" y="536" width="196" height="32" rx="16" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
    <text x="824.0" y="556.5" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991B1B" text-anchor="middle">Blocked: Allergen Rule</text>
  </g>
  <g id="Button-Yes, Place Order (€1,184)">
    <rect x="96" y="594" width="240" height="52" rx="12" fill="#059669" stroke="#059669" stroke-width="1.2"/>
    <text x="216.0" y="625.0" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Yes, Place Order (€1,184)</text>
  </g>
  <g id="Button-Find Best Options">
    <rect x="352" y="594" width="230" height="52" rx="12" fill="#0052CC" stroke="#0052CC" stroke-width="1.2"/>
    <text x="467.0" y="625.0" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Find Best Options</text>
  </g>
  <g id="Button-Only Order 800 L in Stock">
    <rect x="598" y="594" width="230" height="52" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="713.0" y="625.0" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Only Order 800 L in Stock</text>
  </g>
  <g id="Button-Pause Assistant">
    <rect x="844" y="594" width="180" height="52" rx="12" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.2"/>
    <text x="934.0" y="625.0" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="middle">Pause Assistant</text>
  </g>
  <rect x="96" y="676" width="1248" height="144" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="124" y="714" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">How Technical Requirements Stay Invisible to Chefs (Yet Win Judge Points):</text>
  <text x="124" y="744" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">• Open Standards &amp; Data Privacy run silently behind Valio Aimo&#x27;s API — chefs just see &#x27;Verified Stock &amp; Contract Price&#x27;.</text>
  <text x="124" y="772" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">• A tiny optional &#x27;View Supplier Verification Receipt&#x27; link in Past Orders lets auditors/judges inspect proof on demand.</text>
  <text x="124" y="800" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">• Maximum 3 clear cards per screen so decision-making takes under 10 seconds.</text>
</svg>
